<style>
html,body{margin:0;padding:0;background:#0a0d13;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e5e9f0;}

.btn{border:none;border-radius:10px;padding:11px 18px;font-size:13.5px;font-weight:700;cursor:pointer;}

.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 0 14px;}
.result-box{background:#0d1119;border:1px solid #1a2130;border-radius:12px;padding:16px;text-align:center;}
.result-num{font-size:22px;font-weight:800;color:#f97316;}

.result-summary{font-size:12.5px;color:#9aa4b2;background:#0d1119;border:1px solid #1a2130;border-radius:10px;padding:12px 14px;}

.warn-box{background:rgba(249,115,22,.08);border:1px solid rgba(249,115,22,.3);border-radius:12px;padding:14px 16px;font-size:12.5px;color:#e5e9f0;margin-bottom:14px;}
.sexo-row{display:flex;gap:8px;}
.sexo-row .chip{flex:1;text-align:center;background:#0d1119;border:1px solid #1e2633;color:#9aa4b2;font-size:13px;font-weight:700;padding:10px;border-radius:9px;cursor:pointer;}
.sexo-row .chip.sel{background:rgba(249,115,22,.1);border-color:rgba(249,115,22,.4);color:#f97316;}
</style>

<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-badge">E</div>
    <div class="logo-text">Elo <span>Fitness</span></div>
  </div>

<div class="wrap">

<script>
const params = new URLSearchParams(window.location.search);
const clienteIdParam = params.get('cliente_id');
const clienteNomeParam = params.get('cliente_nome');
const tabParam = params.get('tab');
const DIAS_SEMANA = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
const app = document.getElementById('app');

const TABS = [
  ['anamnese', 'Anamnese'],
  ['treino', 'Treino'],
  ['energetico', 'TBM - GET'],
  ['avaliacao_fisica', 'Avaliação Física'],
  ['dieta', 'Dieta'],
  ['cardio', 'Cardio'],
  ['evolucao', 'Evolução'],
  ['feedback', 'Feedback'],
  ['agendamentos', 'Agendamentos']
];

const OBJETIVO_LABEL = { emagrecimento: 'Emagrecimento', hipertrofia: 'Hipertrofia', condicionamento: 'Condicionamento', saude: 'Saúde geral' };
const NIVEL_LABEL = { iniciante: 'Iniciante', intermediario: 'Intermediário', avancado: 'Avançado' };

const NIVEL_ATIVIDADE_OPCOES = [
  { key: 'sedentario', nome: 'Sedentário', desc: 'Pouco ou nenhum exercício.', fator: 1.20 },
  { key: 'leve', nome: 'Levemente ativo', desc: 'Exercício leve 1–3 dias/semana.', fator: 1.375 },
  { key: 'moderado', nome: 'Moderadamente ativo', desc: 'Exercício moderado 3–5 dias/semana.', fator: 1.55 },
  { key: 'muito_ativo', nome: 'Muito ativo', desc: 'Exercício pesado 6–7 dias/semana.', fator: 1.725 },
  { key: 'extremo', nome: 'Extremamente ativo', desc: 'Exercício muito pesado e/ou trabalho físico.', fator: 1.90 }
];

const OBJETIVO_CALORICO_OPCOES = [
  { key: 'emagrecer', nome: 'Emagrecer', desc: '−15%', percentual: 0.85 },
  { key: 'emagrecer_agressivo', nome: 'Emagrecer Agressivo', desc: '−30%', percentual: 0.70 },
  { key: 'manter', nome: 'Manter peso', desc: '0%', percentual: 1.00 },
  { key: 'ganho_seco', nome: 'Ganhos Secos', desc: '+7%', percentual: 1.07 },
  { key: 'ganho_agressivo', nome: 'Ganhar Peso Agressivo', desc: '+15%', percentual: 1.15 }
];

const ESTADO_ATUAL_OPCOES = [
  { key: 'magro', nome: 'Magro' },
  { key: 'magro_gordura_moderada', nome: 'Magro com gordura moderada' },
  { key: 'falso_magro', nome: 'Falso magro (skinny fat)' },
  { key: 'acima_peso', nome: 'Muito acima do peso' }
];

function calcularTMB(sexo, pesoKg, alturaCm, idade) {
  const base = 10 * pesoKg + 6.25 * alturaCm - 5 * idade;
  return sexo === 'M' ? base + 5 : base - 161;
}

const DOBRAS_CAMPOS = [
  ['peitoral', 'Peitoral'],
  ['axilar_media', 'Axilar média'],
  ['triceps', 'Tríceps'],
  ['subescapular', 'Subescapular'],
  ['supra_iliaca', 'Supra-ilíaca'],
  ['abdominal', 'Abdominal'],
  ['coxa', 'Coxa']
];

// Jackson & Pollock 7 dobras (densidade corporal, fórmula distinta por sexo) + Siri (% de gordura).
function calcularComposicaoPollock(sexo, idade, dobras) {
  const soma = DOBRAS_CAMPOS.reduce((acc, [chave]) => acc + (Number(dobras[chave]) || 0), 0);
  const densidade = sexo === 'M'
    ? 1.112 - 0.00043499 * soma + 0.00000055 * soma * soma - 0.00028826 * idade
    : 1.097 - 0.00046971 * soma + 0.00000056 * soma * soma - 0.00012828 * idade;
  const percGordura = (495 / densidade) - 450;
  return { soma, densidade, percGordura };
}

function anamnesePerguntaDeveAparecer(q, respostas) {
  if (!q.depende_de) return true;
  const val = respostas[q.depende_de.pergunta_id];
  if (Array.isArray(val)) return q.depende_de.valores.some(v => val.includes(v));
  return q.depende_de.valores.includes(val);
}

function anamneseFormatarResposta(q, valor) {
  if (valor == null || valor === '') return null;
  if (q.tipo === 'escolha_unica') { const op = (q.opcoes || []).find(o => o.valor === valor); return op ? op.label : valor; }
  if (q.tipo === 'escolha_multipla') {
    const vals = Array.isArray(valor) ? valor : [];
    if (!vals.length) return null;
    return vals.map(v => { const op = (q.opcoes || []).find(o => o.valor === v); return op ? op.label : v; }).join(', ');
  }
  if (q.tipo === 'lista_pares') {
    const linhas = Array.isArray(valor) ? valor : [];
    const partes = linhas.map(l => (q.subcampos || []).map(sc => l[sc.key]).filter(Boolean).join(' — ')).filter(Boolean);
    return partes.length ? partes.join('; ') : null;
  }
  return valor;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

let userId = null;
let cliente = null;
let exerciciosLib = [];
let tecnicasLib = [];
let treinos = [];
let dietaList = [];
let cardioList = [];
let agendamentosList = [];
let anamnese = null;
let anamneseEstrutura = { secoes: [], perguntas: [] };
let anamneseDinamica = {};
let anamneseDinamicaFormOpen = false;
let anamneseDinamicaEdit = null;
let avaliacoesFisicas = [];
let avaliacaoFisicaFormOpen = false;
let avaliacaoFisicaEditId = '';
let fotosList = [];
let pesoList = [];
let medidasList = [];
let comparacoesList = [];
let evolucaoSubTab = 'linha_tempo';
let pesoFormOpen = false;
let medidaFormOpen = false;
let medidaEditId = '';
let medidaCompararSelecionando = false;
let medidaCompararDataA = '';
let medidaCompararDataB = '';
let medidaCompararAberto = false;
let comparacaoFormOpen = false;
let comparacaoSelecaoAntes = [];
let comparacaoSelecaoDepois = [];
let feedbacksList = [];
let convite = null;
let conviteLinkAberto = false;
let activeTab = tabParam || 'treino';

let taDetalheId = '';
let taDetalheExercicios = [];
let taAddExOpen = false;

let cardioFormOpen = false;
let cardioEditId = '';

let anamneseFormOpen = false;

let agFormOpen = false;

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function iniciais(nome) {
  return (nome || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();
}

function diasLabel(dias) {
  if (!dias || !dias.length) return 'Sem dias definidos';
  return dias.slice().sort().map(d => DIAS_SEMANA[d].slice(0, 3)).join(', ');
}

async function init() {
  if (!clienteIdParam) { window.location.href = 'alunos.html'; return; }

  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) return;
  userId = user.id;

  const { data: cl } = await supabaseClient.from('clientes').select('*').eq('id', clienteIdParam).eq('trainer_id', userId).maybeSingle();
  if (!cl) { window.location.href = 'alunos.html'; return; }
  cliente = cl;

  const [exsRes, tecsRes, trRes, dietaRes, cardioRes, avFisicaRes, pesoRes, medidasRes, comparacoesRes, anamneseRes, anamneseDinRes, tplTrainerRes, fotosRes, feedbacksRes, agRes, convRes] = await Promise.all([
    supabaseClient.from('exercicios').select('id, nome').eq('trainer_id', userId).order('nome'),
    supabaseClient.from('tecnicas_avancadas').select('id, nome, observacao').eq('trainer_id', userId).order('created_at'),
    supabaseClient.from('treinos').select('*').eq('cliente_id', clienteIdParam).order('created_at', { ascending: false }),
    supabaseClient.from('dietas').select('*').eq('cliente_id', clienteIdParam).order('created_at', { ascending: false }),
    supabaseClient.from('cardio_protocolos').select('*').eq('cliente_id', clienteIdParam).order('created_at', { ascending: false }),
    supabaseClient.from('avaliacoes_fisicas').select('*').eq('cliente_id', clienteIdParam).order('data', { ascending: false }),
    supabaseClient.from('registros_peso').select('*').eq('cliente_id', clienteIdParam).order('data', { ascending: false }),
    supabaseClient.from('medidas_corporais').select('*').eq('cliente_id', clienteIdParam).order('data', { ascending: false }),
    supabaseClient.from('comparacoes_fotos').select('*').eq('cliente_id', clienteIdParam).order('created_at', { ascending: false }),
    supabaseClient.from('anamnese_respostas').select('*').eq('cliente_id', clienteIdParam).maybeSingle(),
    supabaseClient.from('anamnese_respostas_dinamicas').select('*').eq('cliente_id', clienteIdParam).maybeSingle(),
    supabaseClient.from('anamnese_templates').select('estrutura').eq('trainer_id', userId).maybeSingle(),
    supabaseClient.from('fotos_evolucao').select('*').eq('cliente_id', clienteIdParam).order('created_at', { ascending: false }),
    supabaseClient.from('feedbacks_treino').select('*').eq('cliente_id', clienteIdParam).order('created_at', { ascending: false }),
    supabaseClient.from('agendamentos').select('*').eq('cliente_id', clienteIdParam).order('data_lembrete', { ascending: true }),
    supabaseClient.from('convites').select('*').eq('cliente_id', clienteIdParam).order('created_at', { ascending: false }).limit(1).maybeSingle()
  ]);
  exerciciosLib = exsRes.data || [];
  tecnicasLib = tecsRes.data || [];
  treinos = trRes.data || [];
  dietaList = dietaRes.data || [];
  cardioList = cardioRes.data || [];
  avaliacoesFisicas = avFisicaRes.data || [];
  pesoList = pesoRes.data || [];
  medidasList = medidasRes.data || [];
  comparacoesList = comparacoesRes.data || [];
  anamnese = anamneseRes.data || null;
  anamneseDinamica = (anamneseDinRes.data && anamneseDinRes.data.respostas) || {};
  anamneseEstrutura = tplTrainerRes.data && tplTrainerRes.data.estrutura;
  if (!anamneseEstrutura) {
    const { data: tplDefault } = await supabaseClient.from('anamnese_templates').select('estrutura').is('trainer_id', null).maybeSingle();
    anamneseEstrutura = (tplDefault && tplDefault.estrutura) || { secoes: [], perguntas: [] };
  }
  const fotosRaw = fotosRes.data || [];
  if (fotosRaw.length) {
    const { data: signed } = await supabaseClient.storage.from('fotos-evolucao').createSignedUrls(fotosRaw.map(f => f.url), 60 * 60 * 24 * 7);
    fotosList = fotosRaw.map((f, i) => ({ ...f, url: (signed && signed[i] && signed[i].signedUrl) || '' }));
  } else {
    fotosList = [];
  }
  feedbacksList = feedbacksRes.data || [];
  agendamentosList = agRes.data || [];
  convite = convRes.data || null;

  render();
}

function render() {
  app.innerHTML = '';
  app.appendChild(renderHeader());
  app.appendChild(renderTabs());
  if (!cliente.auth_user_id && (activeTab === 'treino' || activeTab === 'dieta')) {
    app.appendChild(el(
      '<div style="background:rgba(250,204,21,.08);border:1px solid rgba(250,204,21,.25);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:12.5px;color:#facc15;">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:3px;flex-shrink:0;"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg> ' + cliente.nome + ' ainda não aceitou o convite de acesso — nada do que você montar aqui aparece pra ele até o cadastro dele ser concluído. Convide ou reenvie o convite no topo da página.' +
      '</div>'
    ));
  }
  const body = el('<div></div>');
  if (activeTab === 'treino') renderTreinoTab(body);
  else if (activeTab === 'dieta') renderDietaTab(body);
  else if (activeTab === 'cardio') renderCardioTab(body);
  else if (activeTab === 'anamnese') renderAnamneseTab(body);
  else if (activeTab === 'energetico') renderEnergeticoTab(body);
  else if (activeTab === 'avaliacao_fisica') renderAvaliacaoFisicaTab(body);
  else if (activeTab === 'evolucao') renderEvolucaoTab(body);
  else if (activeTab === 'feedback') renderFeedbackTab(body);
  else if (activeTab === 'agendamentos') renderAgendamentosTab(body);
  app.appendChild(body);
}

const TEMPO_TREINO_LABEL = { '1_a_6_meses': '1 a 6 meses', '6_meses_a_1_ano': '6 meses a 1 ano', '1_a_3_anos': '1 a 3 anos', 'acima_3_anos': 'Acima de 3 anos' };

function renderAnamneseTab(container) {
  if (anamneseFormOpen) { renderAnamneseForm(container); return; }
  if (anamneseDinamicaFormOpen) { renderAnamneseDinamicaForm(container); return; }

  if (!anamnese) {
    container.appendChild(el('<div class="empty">Aguardando resposta do aluno. Assim que ele preencher a anamnese, as respostas aparecem aqui.</div>'));
    const preencherBtn = el('<button type="button" class="btn btn-outline btn-block">Preencher sexo, idade, altura e peso</button>');
    preencherBtn.addEventListener('click', () => { anamneseFormOpen = true; render(); });
    container.appendChild(preencherBtn);
    return;
  }
  const linha = (label, valor) => el(
    '<div class="list-row"><div class="list-row-meta" style="text-transform:uppercase;letter-spacing:.04em;font-size:10.5px;">' + esc(label) + '</div>' +
    '<div class="list-row-nome" style="margin-top:4px;">' + esc(valor || '—') + '</div></div>'
  );
  container.appendChild(linha('Objetivo', OBJETIVO_LABEL[anamnese.objetivo] || anamnese.objetivo));
  container.appendChild(linha('Tempo de treino', anamnese.tempo_treino ? TEMPO_TREINO_LABEL[anamnese.tempo_treino] : (anamnese.nivel ? NIVEL_LABEL[anamnese.nivel] || anamnese.nivel : null)));
  container.appendChild(linha('Sexo', anamnese.sexo === 'M' ? 'Masculino' : anamnese.sexo === 'F' ? 'Feminino' : null));

function renderAnamneseDinamicaForm(container) {
  if (!anamneseDinamicaEdit) anamneseDinamicaEdit = JSON.parse(JSON.stringify(anamneseDinamica || {}));
  const resp = anamneseDinamicaEdit;

  const box = el('<div class="form-box"></div>');
  box.appendChild(el('<div class="sub" style="margin:0 0 16px;">Editando a anamnese detalhada do aluno.</div>'));

  const perguntasWrap = el('<div></div>');
  box.appendChild(perguntasWrap);

  function renderPergunta(q) {
    const wrap = el('<div style="margin-bottom:14px;"></div>');
    wrap.appendChild(el('<label>' + esc(q.label) + '</label>'));

    if (q.tipo === 'texto' || q.tipo === 'horario') {
      const input = el('<input type="' + (q.tipo === 'horario' ? 'time' : 'text') + '">');
      input.value = resp[q.id] || '';
      input.addEventListener('input', () => { resp[q.id] = input.value; });
      wrap.appendChild(input);
    } else if (q.tipo === 'texto_longo') {
      const ta = el('<textarea rows="2"></textarea>');
      ta.value = resp[q.id] || '';
      ta.addEventListener('input', () => { resp[q.id] = ta.value; });
      wrap.appendChild(ta);
    } else if (q.tipo === 'escolha_unica') {
      const row = el('<div class="sexo-row" style="flex-wrap:wrap;"></div>');
      (q.opcoes || []).forEach(o => {
        const chip = el('<div class="chip' + (resp[q.id] === o.valor ? ' sel' : '') + '">' + esc(o.label) + '</div>');
        chip.addEventListener('click', () => { resp[q.id] = o.valor; renderPerguntas(); });
        row.appendChild(chip);
      });
      wrap.appendChild(row);
    } else if (q.tipo === 'escolha_multipla') {
      const atual = Array.isArray(resp[q.id]) ? resp[q.id] : [];
      const row = el('<div class="sexo-row" style="flex-wrap:wrap;"></div>');
      (q.opcoes || []).forEach(o => {
        const sel = atual.includes(o.valor);
        const chip = el('<div class="chip' + (sel ? ' sel' : '') + '">' + esc(o.label) + '</div>');
        chip.addEventListener('click', () => {
          resp[q.id] = sel ? atual.filter(v => v !== o.valor) : [...atual, o.valor];
          renderPerguntas();
        });
        row.appendChild(chip);
      });
      wrap.appendChild(row);
    } else if (q.tipo === 'lista_pares') {
      const linhas = Array.isArray(resp[q.id]) && resp[q.id].length ? resp[q.id] : [{}];
      const linhasWrap = el('<div style="display:flex;flex-direction:column;gap:8px;"></div>');
      linhas.forEach((linha, idx) => {
        const linhaRow = el('<div style="display:flex;gap:8px;align-items:center;"></div>');
        (q.subcampos || []).forEach(sc => {
          const inp = el('<input placeholder="' + esc(sc.label) + '" style="flex:1;min-width:0;">');
          inp.value = linha[sc.key] || '';
          inp.addEventListener('input', () => { linha[sc.key] = inp.value; resp[q.id] = linhas; });
          linhaRow.appendChild(inp);
        });
        if (linhas.length > 1) {
          const rmBtn = el('<button type="button" style="background:none;border:none;color:#66707e;font-size:18px;cursor:pointer;">×</button>');
          rmBtn.addEventListener('click', () => { resp[q.id] = linhas.filter((_, i) => i !== idx); renderPerguntas(); });
          linhaRow.appendChild(rmBtn);
        }
        linhasWrap.appendChild(linhaRow);
      });
      wrap.appendChild(linhasWrap);
      const addBtn = el('<button type="button" class="btn btn-outline" style="margin-top:6px;">+ adicionar</button>');
      addBtn.addEventListener('click', () => { resp[q.id] = [...linhas, {}]; renderPerguntas(); });
      wrap.appendChild(addBtn);
    }
    return wrap;
  }

  function renderPerguntas() {
    perguntasWrap.innerHTML = '';
    const secoes = (anamneseEstrutura.secoes || []).slice().sort((a, b) => a.ordem - b.ordem);
    secoes.forEach(sec => {
      const perguntas = (anamneseEstrutura.perguntas || [])
        .filter(q => q.secao_id === sec.id && anamnesePerguntaDeveAparecer(q, resp))
        .sort((a, b) => a.ordem - b.ordem);
      if (!perguntas.length) return;
      const secBox = el('<div style="margin-bottom:18px;"></div>');
      secBox.appendChild(el('<div class="list-row-meta" style="text-transform:uppercase;letter-spacing:.04em;font-size:10.5px;margin-bottom:8px;">' + esc(sec.titulo) + '</div>'));
      perguntas.forEach(q => secBox.appendChild(renderPergunta(q)));
      perguntasWrap.appendChild(secBox);
    });
  }

  renderPerguntas();

  const actions = el('<div class="actions-row"></div>');
  const cancelBtn = el('<button type="button" class="btn btn-secondary">Cancelar</button>');
  cancelBtn.addEventListener('click', () => { anamneseDinamicaEdit = null; anamneseDinamicaFormOpen = false; render(); });
  const salvarBtn = el('<button type="button" class="btn btn-primary">Salvar</button>');
  salvarBtn.addEventListener('click', async () => {
    salvarBtn.disabled = true; salvarBtn.textContent = 'Salvando…';
    const { error } = await supabaseClient.from('anamnese_respostas_dinamicas').upsert({
      cliente_id: clienteIdParam, trainer_id: userId, respostas: resp, respondido_em: new Date().toISOString()
    }, { onConflict: 'cliente_id' });
    if (error) { alert('Não foi possível salvar: ' + error.message); salvarBtn.disabled = false; salvarBtn.textContent = 'Salvar'; return; }
    anamneseDinamica = resp;
    anamneseDinamicaEdit = null;
    anamneseDinamicaFormOpen = false;
    render();
  });
  actions.appendChild(cancelBtn); actions.appendChild(salvarBtn);
  box.appendChild(actions);
  container.appendChild(box);
}

function renderEnergeticoTab(container) {

  if (!dadosCompletos) {

    container.appendChild(irBtn);
    return;
  }

  const salvarCampo = async (campo, valor) => {
    const payload = { cliente_id: clienteIdParam, trainer_id: userId, [campo]: valor };
    const { error } = await supabaseClient.from('anamnese_respostas').upsert(payload, { onConflict: 'cliente_id' });
    if (!error) anamnese[campo] = valor;
    render();
  };

  const renderGrupo = (titulo, opcoes, campo, mostrarExtra) => {
    container.appendChild(el('<label style="margin-top:2px;">' + titulo + '</label>'));
    const grupo = el('<div class="opt-group"></div>');
    opcoes.forEach(op => {
      const sel = anamnese[campo] === op.key;
      const card = el('<div class="opt-card' + (sel ? ' sel' : '') + '"></div>');
      card.appendChild(el('<div class="opt-nome">' + op.nome + '</div>'));
      if (op.desc) card.appendChild(el('<div class="opt-desc">' + op.desc + '</div>'));
      if (mostrarExtra && op.fator) card.appendChild(el('<div class="opt-fator">Fator ' + op.fator.toFixed(3).replace(/0+$/, '').replace(/\.$/, '') + '</div>'));
      card.addEventListener('click', () => salvarCampo(campo, op.key));
      grupo.appendChild(card);
    });
    container.appendChild(grupo);
  };

  container.appendChild(el('<div class="sub" style="margin:0 0 4px;">Atividade e Objetivos</div>'));
  renderGrupo('Nível de Atividade', NIVEL_ATIVIDADE_OPCOES, 'nivel_atividade', true);
  renderGrupo('Objetivo', OBJETIVO_CALORICO_OPCOES, 'objetivo_calorico', false);
  renderGrupo('Estado Atual', ESTADO_ATUAL_OPCOES, 'estado_atual', false);

  const nivelSel = NIVEL_ATIVIDADE_OPCOES.find(o => o.key === anamnese.nivel_atividade);
  const objSel = OBJETIVO_CALORICO_OPCOES.find(o => o.key === anamnese.objetivo_calorico);
  const estadoSel = ESTADO_ATUAL_OPCOES.find(o => o.key === anamnese.estado_atual);

  const tmb = calcularTMB(anamnese.sexo, anamnese.peso_kg, anamnese.altura_cm, anamnese.idade);
  const get = nivelSel ? tmb * nivelSel.fator : null;
  const meta = get != null && objSel ? get * objSel.percentual : null;

  container.appendChild(el('<div class="sub" style="margin:18px 0 4px;">Resultados da Sua Dieta</div>'));
  const grid = el('<div class="result-grid"></div>');
  [
    ['Taxa Metabólica Basal (TMB)', Math.round(tmb) + ' kcal'],
    ['Gasto Energético Total (TDEE)', get != null ? Math.round(get) + ' kcal' : '—'],
    ['Meta Calórica', meta != null ? Math.round(meta) + ' kcal' : '—']
  ].forEach(([label, val]) => {
    const box = el('<div class="result-box"></div>');
    box.appendChild(el('<div class="result-num">' + val + '</div>'));
    box.appendChild(el('<div class="result-label">' + label + '</div>'));
    grid.appendChild(box);
  });
  container.appendChild(grid);

  container.appendChild(el(
    '<div class="result-summary">' +
    'Nível de Atividade: <b>' + (nivelSel ? nivelSel.nome : 'não selecionado') + '</b><br>' +
    'Objetivo: <b>' + (objSel ? objSel.nome : 'não selecionado') + '</b><br>' +
    'Estado Atual: <b>' + (estadoSel ? estadoSel.nome : 'não selecionado') + '</b>' +
    '</div>'
  ));
}

function avaliacaoDobrasDeRegistro(av) {
  return {
    peitoral: av.dobra_peitoral, axilar_media: av.dobra_axilar_media, triceps: av.dobra_triceps,
    subescapular: av.dobra_subescapular, supra_iliaca: av.dobra_supra_iliaca, abdominal: av.dobra_abdominal, coxa: av.dobra_coxa
  };
}

function avaliacaoResultado(av) {
  const { soma, percGordura } = calcularComposicaoPollock(av.sexo, av.idade, avaliacaoDobrasDeRegistro(av));
  const massaGorda = av.peso_kg * (percGordura / 100);
  const massaMagra = av.peso_kg - massaGorda;
  return { soma, percGordura, massaGorda, massaMagra };
}

      if (!dobraInputs[chave].value || !(v > 0)) dobrasOk = false;
    });
    if (!dobrasOk) {
      resultBox.appendChild(el('<div class="warn-box">Preencha sexo, idade e todas as 7 dobras para calcular o percentual de gordura.</div>'));
      return;
    }
    const { soma, percGordura } = calcularComposicaoPollock(sexoVal || 'M', idade, dobras);
    resultBox.appendChild(el('<div class="result-summary" style="margin-bottom:12px;">Soma das 7 dobras: <b>' + soma.toFixed(1) + ' mm</b></div>'));
    if (!sexoVal || !(idade > 0)) {
      resultBox.appendChild(el('<div class="warn-box">Selecione o sexo e informe a idade para calcular o percentual de gordura.</div>'));
      return;
    }
    const grid = el('<div class="result-grid" style="grid-template-columns:repeat(2,1fr);"></div>');
    const boxPerc = el('<div class="result-box"></div>');
    boxPerc.appendChild(el('<div class="result-num">' + percGordura.toFixed(1) + '%</div>'));
    boxPerc.appendChild(el('<div class="result-label">Percentual de gordura</div>'));
    grid.appendChild(boxPerc);
    if (peso > 0) {
      const massaGorda = peso * (percGordura / 100);
      const massaMagra = peso - massaGorda;
      const boxMassas = el('<div class="result-box"></div>');
      boxMassas.appendChild(el('<div class="result-num" style="font-size:15px;">' + massaGorda.toFixed(1) + ' kg / ' + massaMagra.toFixed(1) + ' kg</div>'));
      boxMassas.appendChild(el('<div class="result-label">Massa de gordura / Massa livre de gordura</div>'));
      grid.appendChild(boxMassas);
    } else {
      const boxSemPeso = el('<div class="result-box"></div>');
      boxSemPeso.appendChild(el('<div class="result-num" style="font-size:12.5px;color:#66707e;">Informe o peso</div>'));
      boxSemPeso.appendChild(el('<div class="result-label">Massa de gordura / Massa livre de gordura</div>'));
      grid.appendChild(boxSemPeso);
    }
    resultBox.appendChild(grid);
  }

  [idadeInput, pesoInput, ...Object.values(dobraInputs)].forEach(inp => inp.addEventListener('input', atualizarResultado));
  atualizarResultado();

  const obs = el('<textarea rows="3" placeholder="Observações (opcional)" style="margin-top:4px;"></textarea>');
  obs.value = editando ? (editando.observacoes || '') : '';
  box.appendChild(el('<label style="margin-top:14px;">Observações</label>')); box.appendChild(obs);

  const erro = el('<div class="erro" style="display:none;"></div>');
  box.appendChild(erro);

  const actions = el('<div class="actions-row"></div>');
  const cancelBtn = el('<button type="button" class="btn btn-secondary">Cancelar</button>');
  cancelBtn.addEventListener('click', () => { avaliacaoFisicaFormOpen = false; render(); });
  const salvarBtn = el('<button type="button" class="btn btn-primary">' + (editando ? 'Salvar alterações' : 'Criar avaliação') + '</button>');
  salvarBtn.addEventListener('click', async () => {
    const idade = Number(idadeInput.value);
    const peso = Number(pesoInput.value);
    const dobrasPayload = {};
    let dobraFaltando = false;
    DOBRAS_CAMPOS.forEach(([chave]) => {
      const v = Number(dobraInputs[chave].value);
      if (!dobraInputs[chave].value || !(v > 0)) dobraFaltando = true;
      dobrasPayload['dobra_' + chave] = v;
    });
    if (!sexoVal) { erro.textContent = 'Selecione o sexo.'; erro.style.display = ''; return; }
    if (!(idade > 0)) { erro.textContent = 'Informe a idade.'; erro.style.display = ''; return; }
    if (!(peso > 0)) { erro.textContent = 'Informe o peso.'; erro.style.display = ''; return; }
    if (!dataInput.value) { erro.textContent = 'Informe a data da avaliação.'; erro.style.display = ''; return; }
    if (dobraFaltando) { erro.textContent = 'Preencha todas as 7 dobras para calcular o percentual de gordura.'; erro.style.display = ''; return; }

    salvarBtn.disabled = true; salvarBtn.textContent = 'Salvando…';
    const payload = {
      sexo: sexoVal,
      idade,
      peso_kg: peso,
      altura_cm: alturaInput.value ? Number(alturaInput.value) : null,
      data: dataInput.value,
      observacoes: obs.value.trim() || null,
      ...dobrasPayload
    };
    let error;
    if (editando) {
      ({ error } = await supabaseClient.from('avaliacoes_fisicas').update(payload).eq('id', editando.id));
    } else {
      ({ error } = await supabaseClient.from('avaliacoes_fisicas').insert({ ...payload, trainer_id: userId, cliente_id: clienteIdParam }));
    }
    if (error) { erro.textContent = error.message; erro.style.display = ''; salvarBtn.disabled = false; salvarBtn.textContent = editando ? 'Salvar alterações' : 'Criar avaliação'; return; }
    const { data } = await supabaseClient.from('avaliacoes_fisicas').select('*').eq('cliente_id', clienteIdParam).order('data', { ascending: false });
    avaliacoesFisicas = data || [];
    avaliacaoFisicaFormOpen = false;
    render();
  });
  actions.appendChild(cancelBtn); actions.appendChild(salvarBtn);
  box.appendChild(actions);
  container.appendChild(box);
}

let taDetalheCargas = {}; // treino_exercicio_id -> serie_index -> [{data, carga}, ...] desc por data
let taDetalheFeitosHoje = {}; // treino_exercicio_id -> true (marcado hoje pelo aluno)
let taDetalheExecucoes = []; // [{data, created_at, foto_url}, ...] desc por data — histórico de "finalizar treino" deste treino
let taDetalheFotosTreino = {}; // data (YYYY-MM-DD) -> signed URL da foto opcional anexada naquele dia

const TA_HOJE_ISO = new Date().toISOString().slice(0, 10);

async function openTaDetalhe(treinoId) {
  taDetalheId = treinoId;
  taAddExOpen = false;
  const { data } = await supabaseClient
    .from('treino_exercicios')
    .select('*, exercicios(nome)')
    .eq('treino_id', treinoId)
    .order('ordem', { ascending: true });
  taDetalheExercicios = data || [];
  taDetalheCargas = {};
  taDetalheFeitosHoje = {};
  const { data: execs } = await supabaseClient
    .from('treino_execucoes')
    .select('data, created_at, foto_url')
    .eq('treino_id', treinoId)
    .order('data', { ascending: false });
  taDetalheExecucoes = execs || [];
  taDetalheFotosTreino = {};
  const fotosPaths = taDetalheExecucoes.filter(e => e.foto_url).map(e => e.foto_url);
  if (fotosPaths.length) {
    const { data: signed } = await supabaseClient.storage.from('fotos-evolucao').createSignedUrls(fotosPaths, 60 * 60 * 24 * 7);
    taDetalheExecucoes.forEach(e => {
      if (!e.foto_url) return;
      const s = (signed || []).find(x => x.path === e.foto_url);
      if (s && s.signedUrl) taDetalheFotosTreino[e.data] = s.signedUrl;
    });
  }
  if (taDetalheExercicios.length) {
    const [{ data: cargas }, { data: feitosHoje }] = await Promise.all([
      supabaseClient.from('serie_cargas').select('treino_exercicio_id, serie_index, carga, data')
        .in('treino_exercicio_id', taDetalheExercicios.map(te => te.id)).order('data', { ascending: false }),
      supabaseClient.from('treino_exercicio_execucoes').select('treino_exercicio_id')
        .in('treino_exercicio_id', taDetalheExercicios.map(te => te.id)).eq('data', TA_HOJE_ISO)
    ]);
    (cargas || []).forEach(c => {
      const porExercicio = taDetalheCargas[c.treino_exercicio_id] || (taDetalheCargas[c.treino_exercicio_id] = {});
      const lista = porExercicio[c.serie_index] || (porExercicio[c.serie_index] = []);
      if (lista.length < 2) lista.push(c);
    });
    (feitosHoje || []).forEach(r => { taDetalheFeitosHoje[r.treino_exercicio_id] = true; });
  }
  render();
}

// Mesma expansão usada no app do aluno pra série "4x12" numa linha só virar
// 4 séries de verdade — precisa ser idêntica dos dois lados, senão o índice
// (serie_index) que o aluno salva no banco não bate com a linha que o
// treinador está lendo aqui, e a carga da Série 2+ nunca aparece.
function expandirSeriesLinhas(linhas) {
  const out = [];
  (linhas || []).forEach(linha => {
    const m = linha.match(/^(\d{1,2})\s*[x×X]\s*(.+)$/);
    const n = m ? parseInt(m[1], 10) : 0;
    if (m && n >= 1 && n <= 15) {
      const resto = m[2].trim();
      for (let i = 0; i < n; i++) out.push(resto);
    } else {
      out.push(linha);
    }
  });
  return out;
}

// "Série N — texto — atual (anterior: X)": mostra TODAS as séries
// prescritas assim que o aluno já registrou pelo menos uma carga no
// exercício — série sem carga aparece como "não preenchida" em vez de
// sumir, pra não dar a impressão de que a carga "vazou" pra outra série.
function renderCargasSerieList(te) {
  const cargasPorSerie = taDetalheCargas[te.id];
  if (!cargasPorSerie || !Object.keys(cargasPorSerie).length) return null;
  const linhas = expandirSeriesLinhas((te.series || '').split('\n').map(s => s.trim()).filter(Boolean));
  const wrap = el('<div style="margin-top:8px;padding-top:8px;border-top:1px dashed #1e2633;display:flex;flex-direction:column;gap:3px;"></div>');
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  linhas.forEach((texto, si) => {
    const historico = cargasPorSerie[si];
    let txt;
    if (historico && historico.length) {
      const atual = historico[0];
      const anterior = historico[1];
      txt = 'Série ' + (si + 1) + ' — ' + texto + ' — Carga utilizada: <b style="color:#4ade80;">' + esc(atual.carga) + '</b>';
      if (anterior && anterior.carga !== atual.carga) txt += ' <span style="color:#66707e;">(anterior: ' + esc(anterior.carga) + ')</span>';
    } else {
      txt = 'Série ' + (si + 1) + ' — ' + texto + ' — <span style="color:#66707e;">não preenchida</span>';
    }
    wrap.appendChild(el('<div style="font-size:11.5px;color:#9aa4b2;">' + txt + '</div>'));
  });
  return wrap;
}

function montarDietaUrl(dietaId) {
  let url = 'montar-dieta.html?cliente_id=' + clienteIdParam;
  if (clienteNomeParam) url += '&cliente_nome=' + encodeURIComponent(clienteNomeParam);
  if (dietaId) url += '&dieta_id=' + dietaId;
  return url;
}

function resumoRefeicao(r) {
  if (r.opcoes && r.opcoes.length) {
    return r.opcoes[0].itens.map(it => it.nome + ' (' + it.quantidade_g + 'g)').join(', ') || 'Sem alimentos ainda';
  }
  return r.itens || '';
}

const EVOLUCAO_SUBTABS = [
  ['linha_tempo', 'Linha do tempo'],
  ['peso', 'Peso'],
  ['medidas', 'Medidas'],
  ['fotos', 'Fotos'],
  ['comparacoes', 'Comparações']
];

const MEDIDAS_CAMPOS = [
  ['braco_direito', 'Braço direito'], ['braco_esquerdo', 'Braço esquerdo'],
  ['ombros', 'Ombros'], ['peitoral', 'Peitoral'],
  ['cintura', 'Cintura'], ['abdomen', 'Abdômen'], ['quadril', 'Quadril'],
  ['coxa_direita', 'Coxa direita'], ['coxa_esquerda', 'Coxa esquerda'],
  ['panturrilha_direita', 'Panturrilha direita'], ['panturrilha_esquerda', 'Panturrilha esquerda']
];

function fmtDataBR(d) { return new Date(d + 'T00:00:00').toLocaleDateString('pt-BR'); }

function renderEvolucaoTab(container) {
  const bar = el('<div class="tabs" style="margin-bottom:16px;"></div>');
  EVOLUCAO_SUBTABS.forEach(([key, label]) => {
    const t = el('<div class="tab' + (evolucaoSubTab === key ? ' active' : '') + '">' + label + '</div>');
    t.addEventListener('click', () => { evolucaoSubTab = key; pesoFormOpen = false; medidaFormOpen = false; medidaCompararAberto = false; comparacaoFormOpen = false; render(); });
    bar.appendChild(t);
  });
  container.appendChild(bar);

  if (evolucaoSubTab === 'peso') renderEvolucaoPeso(container);
  else if (evolucaoSubTab === 'medidas') renderEvolucaoMedidas(container);
  else if (evolucaoSubTab === 'fotos') renderEvolucaoFotos(container);
  else if (evolucaoSubTab === 'comparacoes') renderEvolucaoComparacoes(container);
  else renderEvolucaoLinhaTempo(container);
}

function renderEvolucaoLinhaTempo(container) {
  const mapa = {};
  const touch = (data) => { if (!mapa[data]) mapa[data] = { peso: null, medidas: null, avaliacao: null, fotos: [] }; return mapa[data]; };
  pesoList.forEach(p => { touch(p.data).peso = p; });
  medidasList.forEach(m => { touch(m.data).medidas = m; });
  avaliacoesFisicas.forEach(a => { touch(a.data).avaliacao = a; });
  fotosList.forEach(f => { const d = (f.created_at || '').slice(0, 10); if (d) touch(d).fotos.push(f); });

  const datas = Object.keys(mapa).sort((a, b) => b.localeCompare(a));
  if (!datas.length) {
    container.appendChild(el('<div class="empty">Nenhum registro de evolução ainda. Peso, medidas, avaliação física e fotos aparecem aqui conforme forem cadastrados.</div>'));
    return;
  }
  datas.forEach(data => {
    const ev = mapa[data];
    const partes = [];
    if (ev.peso) partes.push('Peso ' + ev.peso.peso + ' kg' + (ev.peso.origem === 'anamnese' ? ' (inicial)' : ''));
    if (ev.medidas) partes.push('Medidas registradas');
    if (ev.avaliacao) partes.push('Avaliação física registrada');
    if (ev.fotos.length) partes.push(ev.fotos.length + (ev.fotos.length === 1 ? ' foto' : ' fotos'));
    container.appendChild(el(
      '<div class="list-row">' +
        '<div class="list-row-nome">' + fmtDataBR(data) + '</div>' +
        '<div class="list-row-meta">' + partes.join(' · ') + '</div>' +
      '</div>'
    ));
  });
}

function renderMedidaForm(container) {

  const inputs = {};
  MEDIDAS_CAMPOS.forEach(([chave, label]) => {

    inputs[chave] = input;

      if (v) { payload[chave] = Number(v); algumPreenchido = true; }
      else payload[chave] = null;

    salvarBtn.disabled = true; salvarBtn.textContent = 'Salvando…';

function renderMedidaComparacao(container) {
  const box = el('<div class="form-box"></div>');
  const row = el('<div class="field-row"></div>');
  const selA = el('<select></select>');
  const selB = el('<select></select>');
  medidasList.forEach(m => {
    selA.appendChild(el('<option value="' + m.data + '"' + (m.data === medidaCompararDataA ? ' selected' : '') + '>' + fmtDataBR(m.data) + '</option>'));
    selB.appendChild(el('<option value="' + m.data + '"' + (m.data === medidaCompararDataB ? ' selected' : '') + '>' + fmtDataBR(m.data) + '</option>'));
  });
  selA.addEventListener('change', () => { medidaCompararDataA = selA.value; render(); });
  selB.addEventListener('change', () => { medidaCompararDataB = selB.value; render(); });
  const colA = el('<div></div>'); colA.appendChild(el('<label>Data anterior</label>')); colA.appendChild(selA);
  const colB = el('<div></div>'); colB.appendChild(el('<label>Data atual</label>')); colB.appendChild(selB);
  row.appendChild(colA); row.appendChild(colB);
  box.appendChild(row);

  const mA = medidasList.find(m => m.data === medidaCompararDataA);
  const mB = medidasList.find(m => m.data === medidaCompararDataB);
  if (mA && mB) {
    const table = el('<div style="display:flex;flex-direction:column;gap:6px;margin-top:14px;"></div>');
    table.appendChild(el(
      '<div style="display:grid;grid-template-columns:1.4fr 1fr 1fr .8fr;gap:8px;font-size:10.5px;font-weight:800;color:#66707e;text-transform:uppercase;letter-spacing:.03em;padding:0 2px;">' +
      '<div>Medida</div><div>Anterior</div><div>Atual</div><div>Diferença</div></div>'
    ));
    MEDIDAS_CAMPOS.forEach(([chave, label]) => {
      const vA = mA[chave], vB = mB[chave];
      if (vA == null && vB == null) return;
      const diff = (vA != null && vB != null) ? (vB - vA) : null;
      const diffTxt = diff == null ? '—' : (diff > 0 ? '+' : '') + Number(diff.toFixed(1)) + ' cm';
      const diffCor = diff == null ? '#66707e' : diff > 0 ? '#4ade80' : diff < 0 ? '#f87171' : '#9aa4b2';
      table.appendChild(el(
        '<div style="display:grid;grid-template-columns:1.4fr 1fr 1fr .8fr;gap:8px;font-size:12.5px;padding:8px 2px;border-top:1px solid #171d29;">' +
        '<div>' + label + '</div><div>' + (vA != null ? vA + ' cm' : '—') + '</div><div>' + (vB != null ? vB + ' cm' : '—') + '</div>' +
        '<div style="color:' + diffCor + ';font-weight:700;">' + diffTxt + '</div></div>'
      ));
    });
    box.appendChild(table);
  }

  const fecharBtn = el('<button type="button" class="btn btn-secondary btn-block" style="margin-top:16px;">Fechar comparação</button>');
  fecharBtn.addEventListener('click', () => { medidaCompararAberto = false; render(); });
  box.appendChild(fecharBtn);
  container.appendChild(box);
}

// ---- Fotos ----

function renderEvolucaoFotos(container) {
  const uploadWrap = el('<label class="btn btn-outline btn-block" style="display:block;text-align:center;cursor:pointer;margin-bottom:16px;">+ Adicionar foto</label>');
  const fileInput = el('<input type="file" accept="image/*" style="display:none;">');
  uploadWrap.appendChild(fileInput);
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    uploadWrap.textContent = 'Enviando…';
    const path = clienteIdParam + '/' + Date.now() + '-' + file.name.replace(/[^a-zA-Z0-9.]/g, '_');
    const { error: upErr } = await supabaseClient.storage.from('fotos-evolucao').upload(path, file);
    if (upErr) { alert('Não foi possível enviar a foto: ' + upErr.message); render(); return; }
    await supabaseClient.from('fotos_evolucao').insert({ cliente_id: clienteIdParam, trainer_id: userId, url: path, tipo: 'evolucao', enviado_por_aluno: false });
    const { data: fotosRaw } = await supabaseClient.from('fotos_evolucao').select('*').eq('cliente_id', clienteIdParam).order('created_at', { ascending: false });
    if (fotosRaw && fotosRaw.length) {
      const { data: signed } = await supabaseClient.storage.from('fotos-evolucao').createSignedUrls(fotosRaw.map(f => f.url), 60 * 60 * 24 * 7);
      fotosList = fotosRaw.map((f, i) => ({ ...f, url: (signed && signed[i] && signed[i].signedUrl) || '' }));
    } else {
      fotosList = [];
    }
    render();
  });
  container.appendChild(uploadWrap);

  if (!fotosList.length) {
    container.appendChild(el('<div class="empty">Nenhuma foto enviada ainda. As fotos aparecem aqui assim que o aluno enviar pela anamnese ou pelo app, ou quando você adicionar acima.</div>'));
    return;
  }

  const porData = {};
  fotosList.forEach(f => { const d = (f.created_at || '').slice(0, 10); (porData[d] = porData[d] || []).push(f); });
  Object.keys(porData).sort((a, b) => b.localeCompare(a)).forEach(data => {
    container.appendChild(el('<div class="sub" style="margin:0 0 10px;font-weight:700;color:#e5e9f0;">' + fmtDataBR(data) + '</div>'));
    const grid = el('<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:22px;"></div>');
    porData[data].forEach(f => {
      grid.appendChild(el('<img src="' + f.url + '" style="width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:1px solid #1e2633;">'));
    });
    container.appendChild(grid);
  });
}

// ---- Comparações ----

let comparacaoModoAtivo = 'antes';

function renderEvolucaoComparacoes(container) {
  if (comparacaoFormOpen) { renderComparacaoForm(container); return; }

  if (!comparacoesList.length) {
    container.appendChild(el('<div class="empty">Nenhuma comparação criada ainda.</div>'));
  }
  comparacoesList.forEach(c => container.appendChild(renderComparacaoCard(c)));

  const novoBtn = el('<button type="button" class="btn btn-outline btn-block" style="margin-top:6px;">+ Criar comparação</button>');
  novoBtn.addEventListener('click', () => {
    if (!fotosList.length) { alert('Envie fotos na aba "Fotos" antes de criar uma comparação.'); return; }
    comparacaoSelecaoAntes = []; comparacaoSelecaoDepois = []; comparacaoModoAtivo = 'antes';
    comparacaoFormOpen = true; render();
  });
  container.appendChild(novoBtn);
}

function renderComparacaoForm(container) {
  const box = el('<div class="form-box"></div>');
  box.appendChild(el('<div class="sub" style="margin:0 0 14px;">Escolha o lado ativo abaixo e clique nas fotos pra adicionar.</div>'));

  const modoRow = el('<div class="sexo-row" style="margin-bottom:16px;"></div>');
  const chipAntes = el('<div class="chip' + (comparacaoModoAtivo === 'antes' ? ' sel' : '') + '">Antes (' + comparacaoSelecaoAntes.length + ')</div>');
  const chipDepois = el('<div class="chip' + (comparacaoModoAtivo === 'depois' ? ' sel' : '') + '">Depois (' + comparacaoSelecaoDepois.length + ')</div>');
  chipAntes.addEventListener('click', () => { comparacaoModoAtivo = 'antes'; render(); });
  chipDepois.addEventListener('click', () => { comparacaoModoAtivo = 'depois'; render(); });
  modoRow.appendChild(chipAntes); modoRow.appendChild(chipDepois);
  box.appendChild(modoRow);

  const porData = {};
  fotosList.forEach(f => { const d = (f.created_at || '').slice(0, 10); (porData[d] = porData[d] || []).push(f); });
  Object.keys(porData).sort((a, b) => b.localeCompare(a)).forEach(data => {
    box.appendChild(el('<div class="list-row-meta" style="text-transform:uppercase;letter-spacing:.04em;font-size:10.5px;margin:10px 0 6px;">' + fmtDataBR(data) + '</div>'));
    const grid = el('<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-bottom:10px;"></div>');
    porData[data].forEach(f => {
      const selecionadaAntes = comparacaoSelecaoAntes.includes(f.id);
      const selecionadaDepois = comparacaoSelecaoDepois.includes(f.id);
      const cor = selecionadaAntes ? '#3b82f6' : selecionadaDepois ? '#4ade80' : 'transparent';
      const wrap = el('<div style="position:relative;cursor:pointer;"></div>');
      wrap.appendChild(el('<img src="' + f.url + '" style="width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;border:2px solid ' + cor + ';">'));
      if (selecionadaAntes) wrap.appendChild(el('<div style="position:absolute;top:4px;left:4px;background:#3b82f6;color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px;">ANTES</div>'));
      if (selecionadaDepois) wrap.appendChild(el('<div style="position:absolute;top:4px;left:4px;background:#4ade80;color:#0a0d13;font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px;">DEPOIS</div>'));
      wrap.addEventListener('click', () => {
        comparacaoSelecaoAntes = comparacaoSelecaoAntes.filter(id => id !== f.id);
        comparacaoSelecaoDepois = comparacaoSelecaoDepois.filter(id => id !== f.id);
        if (comparacaoModoAtivo === 'antes') comparacaoSelecaoAntes.push(f.id); else comparacaoSelecaoDepois.push(f.id);
        render();
      });
      grid.appendChild(wrap);
    });
    box.appendChild(grid);
  });

  const erro = el('<div class="erro" style="display:none;"></div>');
  box.appendChild(erro);
  const actions = el('<div class="actions-row"></div>');
  const cancelBtn = el('<button type="button" class="btn btn-secondary">Cancelar</button>');
  cancelBtn.addEventListener('click', () => { comparacaoFormOpen = false; render(); });
  const salvarBtn = el('<button type="button" class="btn btn-primary">Salvar comparação</button>');
  salvarBtn.addEventListener('click', async () => {
    if (!comparacaoSelecaoAntes.length || !comparacaoSelecaoDepois.length) { erro.textContent = 'Selecione pelo menos uma foto de "Antes" e uma de "Depois".'; erro.style.display = ''; return; }
    salvarBtn.disabled = true; salvarBtn.textContent = 'Salvando…';
    const { error } = await supabaseClient.from('comparacoes_fotos').insert({
      cliente_id: clienteIdParam, trainer_id: userId,
      fotos_antes_ids: comparacaoSelecaoAntes, fotos_depois_ids: comparacaoSelecaoDepois
    });
    if (error) { erro.textContent = error.message; erro.style.display = ''; salvarBtn.disabled = false; salvarBtn.textContent = 'Salvar comparação'; return; }
    const { data } = await supabaseClient.from('comparacoes_fotos').select('*').eq('cliente_id', clienteIdParam).order('created_at', { ascending: false });
    comparacoesList = data || [];
    comparacaoFormOpen = false;
    render();
  });
  actions.appendChild(cancelBtn); actions.appendChild(salvarBtn);
  box.appendChild(actions);
  container.appendChild(box);
}

function renderComparacaoCard(c) {
  const fotoPorId = {}; fotosList.forEach(f => { fotoPorId[f.id] = f; });
  const antesFotos = (c.fotos_antes_ids || []).map(id => fotoPorId[id]).filter(Boolean);
  const depoisFotos = (c.fotos_depois_ids || []).map(id => fotoPorId[id]).filter(Boolean);
  const card = el('<div class="list-row"></div>');
  const grid = el('<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px;"></div>');
  const coluna = (titulo, cor, fotos) => {
    const col = el('<div></div>');
    col.appendChild(el('<div style="font-size:10.5px;font-weight:800;color:' + cor + ';text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;">' + titulo + (fotos[0] ? ' — ' + fmtDataBR((fotos[0].created_at || '').slice(0, 10)) : '') + '</div>'));
    const g = el('<div style="display:grid;grid-template-columns:repeat(' + (fotos.length > 1 ? 2 : 1) + ',1fr);gap:6px;"></div>');
    fotos.forEach(f => g.appendChild(el('<img src="' + f.url + '" style="width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;border:1px solid #1e2633;">')));
    col.appendChild(g);
    return col;
  };
  grid.appendChild(coluna('Antes', '#3b82f6', antesFotos));
  grid.appendChild(coluna('Depois', '#4ade80', depoisFotos));
  card.appendChild(grid);
  const actions = el('<div class="list-row-actions"></div>');
  const delBtn = el('<button type="button" class="btn-ghost">Excluir</button>');
  delBtn.addEventListener('click', async () => {
    if (!window.confirm('Excluir essa comparação?')) return;
    await supabaseClient.from('comparacoes_fotos').delete().eq('id', c.id);
    comparacoesList = comparacoesList.filter(x => x.id !== c.id);
    render();
  });
  actions.appendChild(delBtn);
  card.appendChild(actions);
  return card;
}

// ---------- FEEDBACK ----------

function renderFeedbackRow(f, treinoNome) {
  return el(
    '<div class="list-row">' +
      '<div class="list-row-nome">' + (treinoNome || (f.humor || 'Sem humor registrado') + (f.rpe ? ' · RPE ' + f.rpe : '')) + '</div>' +
      '<div class="list-row-meta">' + new Date(f.created_at).toLocaleDateString('pt-BR') + '</div>' +
      (f.comentario ? '<div class="list-row-meta" style="margin-top:6px;">' + f.comentario + '</div>' : '') +
    '</div>'
  );
}

function renderFeedbackTab(container) {
  if (!feedbacksList.length) {
    container.appendChild(el('<div class="empty">Nenhum feedback enviado ainda.</div>'));
    return;
  }
  const gerais = feedbacksList.filter(f => !f.treino_id);
  const porTreino = feedbacksList.filter(f => f.treino_id);

  container.appendChild(el('<div class="sub" style="margin-bottom:10px;">Feedback geral (aba Evolução do aluno)</div>'));
  if (!gerais.length) {
    container.appendChild(el('<div class="empty">Nenhum feedback geral ainda.</div>'));
  }
  gerais.forEach(f => container.appendChild(renderFeedbackRow(f)));

  container.appendChild(el('<div class="sub" style="margin:22px 0 10px;">Feedback de cada treino</div>'));
  if (!porTreino.length) {
    container.appendChild(el('<div class="empty">Nenhum feedback de treino ainda.</div>'));
  }
  porTreino.forEach(f => {
    const treino = treinos.find(t => t.id === f.treino_id);
    container.appendChild(renderFeedbackRow(f, treino ? treino.nome : 'Treino removido'));
  });
}

// ---------- AGENDAMENTOS ----------

const TIPOS_AGENDAMENTO = [
  ['revisao_treino', 'Revisão de treino'],
  ['revisao_dieta', 'Revisão de dieta'],
  ['reavaliacao', 'Reavaliação'],
  ['outro', 'Outro']
];

function renderAgendamentosTab(container) {
  container.appendChild(el('<div class="sub" style="margin-bottom:16px;">Lembretes só visíveis pra você — o aluno não vê essa aba.</div>'));

  if (agFormOpen) { renderAgendamentoForm(container); return; }

  if (!agendamentosList.length) {
    container.appendChild(el('<div class="empty">Nenhum agendamento criado ainda.</div>'));
  }
  agendamentosList.forEach(ag => {
    const tipoLabel = (TIPOS_AGENDAMENTO.find(t => t[0] === ag.tipo) || [, ag.tipo || ''])[1];
    const row = el(
      '<div class="list-row" style="opacity:' + (ag.concluido ? '.55' : '1') + ';">' +
        '<div class="list-row-nome">' + ag.titulo + (ag.concluido ? ' ✓' : '') + '</div>' +
        '<div class="list-row-meta">' + tipoLabel + ' · ' + new Date(ag.data_lembrete + 'T00:00:00').toLocaleDateString('pt-BR') + '</div>' +
        (ag.observacoes ? '<div class="list-row-meta" style="margin-top:6px;">' + ag.observacoes + '</div>' : '') +
      '</div>'
    );
    const actions = el('<div class="list-row-actions"></div>');
    const toggleBtn = el('<button type="button" class="btn-ghost" style="color:#9aa4b2;">' + (ag.concluido ? 'Reabrir' : 'Concluir') + '</button>');
    toggleBtn.addEventListener('click', async () => {
      await supabaseClient.from('agendamentos').update({ concluido: !ag.concluido }).eq('id', ag.id);
      ag.concluido = !ag.concluido;
      render();
    });
    const delBtn = el('<button type="button" class="btn-ghost">Excluir</button>');
    delBtn.addEventListener('click', async () => {
      if (!window.confirm('Excluir esse agendamento?')) return;
      await supabaseClient.from('agendamentos').delete().eq('id', ag.id);
      agendamentosList = agendamentosList.filter(x => x.id !== ag.id);
      render();
    });
    actions.appendChild(toggleBtn); actions.appendChild(delBtn);
    row.appendChild(actions);
    container.appendChild(row);
  });

  const novoBtn = el('<button type="button" class="btn btn-outline btn-block" style="margin-top:6px;">+ Novo agendamento</button>');
  novoBtn.addEventListener('click', () => { agFormOpen = true; render(); });
  container.appendChild(novoBtn);
}

function renderAgendamentoForm(container) {
  const box = el('<div class="form-box"></div>');

  const titulo = el('<input type="text" placeholder="Ex: Revisar treino de pernas">');
  box.appendChild(el('<label>Título</label>')); box.appendChild(titulo);

  const row = el('<div class="field-row" style="margin-top:14px;"></div>');
  const tipo = el('<select></select>');
  TIPOS_AGENDAMENTO.forEach(([v, l]) => tipo.appendChild(el('<option value="' + v + '">' + l + '</option>')));
  const data = el('<input type="date">');
  const colA = el('<div></div>'); colA.appendChild(el('<label>Tipo</label>')); colA.appendChild(tipo);
  const colB = el('<div></div>'); colB.appendChild(el('<label>Data</label>')); colB.appendChild(data);
  row.appendChild(colA); row.appendChild(colB);
  box.appendChild(row);

  const obs = el('<textarea rows="3" placeholder="Observações" style="margin-top:14px;"></textarea>');
  box.appendChild(el('<label style="margin-top:14px;">Observações</label>')); box.appendChild(obs);

  const erro = el('<div class="erro" style="display:none;"></div>');
  box.appendChild(erro);

  const actions = el('<div class="actions-row"></div>');
  const cancelBtn = el('<button type="button" class="btn btn-secondary">Cancelar</button>');
  cancelBtn.addEventListener('click', () => { agFormOpen = false; render(); });
  const salvarBtn = el('<button type="button" class="btn btn-primary">Criar agendamento</button>');
  salvarBtn.addEventListener('click', async () => {
    if (!titulo.value.trim()) { erro.textContent = 'Digite um título.'; erro.style.display = ''; return; }
    if (!data.value) { erro.textContent = 'Escolha uma data.'; erro.style.display = ''; return; }
    salvarBtn.disabled = true; salvarBtn.textContent = 'Salvando…';
    const { error } = await supabaseClient.from('agendamentos').insert({
      trainer_id: userId, cliente_id: clienteIdParam, titulo: titulo.value.trim(),
      tipo: tipo.value, data_lembrete: data.value, observacoes: obs.value.trim() || null
    });
    if (error) { erro.textContent = error.message; erro.style.display = ''; salvarBtn.disabled = false; salvarBtn.textContent = 'Criar agendamento'; return; }
    const { data: rows } = await supabaseClient.from('agendamentos').select('*').eq('cliente_id', clienteIdParam).order('data_lembrete', { ascending: true });
    agendamentosList = rows || [];
    agFormOpen = false;
    render();
  });
  actions.appendChild(cancelBtn); actions.appendChild(salvarBtn);
  box.appendChild(actions);
  container.appendChild(box);
}

init();
</script>
